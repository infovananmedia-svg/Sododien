<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Tạo Sơ Đồ Nguyên Lý Cấp Điện Tự Động</title>
  
  <!-- Font tiếng Việt chuẩn Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html2canvas & jsPDF để xuất PDF chuẩn xác 100% tiếng Việt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Thư viện xuất AutoCAD DXF -->
  <script src="https://cdn.jsdelivr.net/npm/dxf-writer@1.17.1/dist/dxf-writer.min.js"></script>

  <style>
    * {
      font-family: 'Roboto', Arial, sans-serif !important;
    }
    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      white-space: nowrap;
      user-select: none;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-6 min-h-screen">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Tiêu đề & Nút bấm -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Trình Tạo Sơ Đồ Nguyên Lý Điện</h1>
        <p class="text-sm text-slate-500 mt-1">Tự động thiết lập sơ đồ nguyên lý - Xuất PDF chuẩn nét & AutoCAD</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="btn-render" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-sm transition">Cập nhật sơ đồ</button>
        <button id="btn-export-pdf" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium shadow-sm transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Xuất PDF (Chuẩn nét)
        </button>
        <button id="btn-export-dxf" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium shadow-sm transition">Xuất AutoCAD (.DXF)</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Cột nhập dữ liệu -->
      <div class="lg:col-span-4 space-y-4">
        
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <h2 class="font-semibold text-base text-slate-800 border-b pb-2">1. Thông số Tủ & Nguồn Vào</h2>
          
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tên tủ điện</label>
            <input type="text" id="panel-name" value="TỦ NHÁNH 1" class="w-full border rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Át tổng (Incomer)</label>
            <input type="text" id="main-breaker" value="MCB 3P 100A 10kA" class="w-full border rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Dây cáp nguồn vào</label>
            <input type="text" id="main-cable" value="CU/XLPE/PVC (4x10) + E(1x6) mm2" class="w-full border rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h2 class="font-semibold text-base text-slate-800">2. Danh sách Át nhánh</h2>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-500">Số lượng:</span>
              <input type="number" id="quick-count" min="1" max="24" value="8" class="w-16 border rounded px-2 py-0.5 text-sm text-center">
              <button id="btn-apply-count" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded">Tạo mẫu</button>
            </div>
          </div>
          
          <div id="branches-list" class="space-y-3 max-h-[380px] overflow-y-auto pr-1"></div>

          <button id="btn-add-branch" class="w-full py-2 border border-dashed border-blue-400 text-blue-600 rounded-lg text-sm font-medium hover:bg-blue-50 transition">+ Thêm 1 nhánh</button>
        </div>

      </div>

      <!-- Cột xem trước bản vẽ -->
      <div class="lg:col-span-8 bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col">
        <h2 class="font-semibold text-base text-slate-800 border-b pb-2 mb-3">Xem trước bản vẽ</h2>
        <div class="flex-1 border border-slate-300 rounded-lg bg-slate-50 overflow-auto flex items-center justify-center p-4 min-h-[550px]">
          
          <!-- Khu vực bản vẽ thực tế (print-area) -->
          <div id="print-area" class="bg-white shadow-md p-6 relative" style="width: 1050px; min-width: 1050px; height: 680px;">
            <svg id="schematic-svg" width="100%" height="100%" viewBox="0 0 1050 680" class="overflow-visible" xmlns="http://www.w3.org/2000/svg">
              <!-- Render động -->
            </svg>
            
            <!-- Layer phủ text HTML thẳng đứng: Triệt tiêu hoàn toàn lỗi xoay và vỡ font -->
            <div id="html-labels-container" class="absolute inset-0 pointer-events-none"></div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    let branches = [
      { name: "GIAN HÀNG 01", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" },
      { name: "GIAN HÀNG 02", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" },
      { name: "GIAN HÀNG 03", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" },
      { name: "GIAN HÀNG 04", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" },
      { name: "GIAN HÀNG 05", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" },
      { name: "GIAN HÀNG 06", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" },
      { name: "GIAN HÀNG 07", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" },
      { name: "GIAN HÀNG 08", power: "5000W", breaker: "RCBO 2P/1N 63A", cable: "CU/XLPE/PVC (2x4) + E(1x2.5) mm2" }
    ];

    const container = document.getElementById('branches-list');

    function renderBranchInputs() {
      container.innerHTML = '';
      branches.forEach((b, idx) => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-2 relative';
        item.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-700">Nhánh #${idx + 1}</span>
            ${branches.length > 1 ? `<button onclick="removeBranch(${idx})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Xóa</button>` : ''}
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-slate-500 font-medium">Tên nhánh</label>
              <input type="text" value="${b.name}" oninput="updateBranch(${idx}, 'name', this.value)" class="w-full border rounded px-2 py-1 text-xs">
            </div>
            <div>
              <label class="text-[10px] text-slate-500 font-medium">Công suất</label>
              <input type="text" value="${b.power}" oninput="updateBranch(${idx}, 'power', this.value)" class="w-full border rounded px-2 py-1 text-xs">
            </div>
            <div>
              <label class="text-[10px] text-slate-500 font-medium">Át nhánh</label>
              <input type="text" value="${b.breaker}" oninput="updateBranch(${idx}, 'breaker', this.value)" class="w-full border rounded px-2 py-1 text-xs">
            </div>
            <div>
              <label class="text-[10px] text-slate-500 font-medium">Dây dẫn</label>
              <input type="text" value="${b.cable}" oninput="updateBranch(${idx}, 'cable', this.value)" class="w-full border rounded px-2 py-1 text-xs">
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function updateBranch(index, field, value) {
      branches[index][field] = value;
    }

    function removeBranch(index) {
      branches.splice(index, 1);
      renderBranchInputs();
      drawSchematic();
    }

    document.getElementById('btn-add-branch').addEventListener('click', () => {
      const idx = branches.length + 1;
      const numStr = idx < 10 ? `0${idx}` : `${idx}`;
      branches.push({
        name: `GIAN HÀNG ${numStr}`,
        power: '5000W',
        breaker: 'RCBO 2P/1N 63A',
        cable: 'CU/XLPE/PVC (2x4) + E(1x2.5) mm2'
      });
      renderBranchInputs();
      drawSchematic();
    });

    document.getElementById('btn-apply-count').addEventListener('click', () => {
      const count = parseInt(document.getElementById('quick-count').value, 10) || 1;
      branches = [];
      for (let i = 1; i <= count; i++) {
        const numStr = i < 10 ? `0${i}` : `${i}`;
        branches.push({
          name: `GIAN HÀNG ${numStr}`,
          power: '5000W',
          breaker: 'RCBO 2P/1N 63A',
          cable: 'CU/XLPE/PVC (2x4) + E(1x2.5) mm2'
        });
      }
      renderBranchInputs();
      drawSchematic();
    });

    // ==========================================
    // VẼ SƠ ĐỒ CHÍNH XÁC
    // ==========================================
    function drawSchematic() {
      const svg = document.getElementById('schematic-svg');
      const htmlLabels = document.getElementById('html-labels-container');
      const printArea = document.getElementById('print-area');
      
      const panelName = document.getElementById('panel-name').value;
      const mainBreaker = document.getElementById('main-breaker').value;
      const mainCable = document.getElementById('main-cable').value;

      const branchWidth = 85;
      const leftMargin = 110;
      const rightMargin = 130;
      const totalWidth = Math.max(1050, leftMargin + branches.length * branchWidth + rightMargin);
      const totalHeight = 680;

      // Cập nhật kích thước khung vẽ
      printArea.style.width = `${totalWidth}px`;
      printArea.style.minWidth = `${totalWidth}px`;
      svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
      svg.innerHTML = '';
      htmlLabels.innerHTML = '';

      const ns = "http://www.w3.org/2000/svg";
      function el(tag, attrs) {
        const elem = document.createElementNS(ns, tag);
        for (let k in attrs) elem.setAttribute(k, attrs[k]);
        return elem;
      }

      // Khung viền bản vẽ
      svg.appendChild(el('rect', { x: 5, y: 5, width: totalWidth - 10, height: totalHeight - 10, fill: '#ffffff', stroke: '#0f172a', 'stroke-width': '2.5' }));
      svg.appendChild(el('rect', { x: 12, y: 12, width: totalWidth - 24, height: totalHeight - 24, fill: 'none', stroke: '#0f172a', 'stroke-width': '1.2' }));

      // Khung tủ điện
      const panelBoxX = leftMargin - 35;
      const panelBoxY = 190;
      const panelBoxW = (branches.length * branchWidth) + 70;
      const panelBoxH = 210;
      svg.appendChild(el('rect', { x: panelBoxX, y: panelBoxY, width: panelBoxW, height: panelBoxH, fill: 'none', stroke: '#0f172a', 'stroke-width': '1.8' }));

      // Tên tủ điện
      const pLabel = document.createElement('div');
      pLabel.className = 'absolute font-bold text-slate-900 tracking-wider';
      pLabel.style.left = `${panelBoxX + 35}px`;
      pLabel.style.top = `${panelBoxY + 38}px`;
      pLabel.style.fontSize = '17px';
      pLabel.textContent = panelName;
      htmlLabels.appendChild(pLabel);

      // Đường nguồn vào
      const incomerX = panelBoxX + (panelBoxW / 2);
      svg.appendChild(el('line', { x1: 40, y1: 100, x2: totalWidth - 40, y2: 100, stroke: '#94a3b8', 'stroke-width': '1' }));
      svg.appendChild(el('polygon', { points: `${incomerX},100 ${incomerX - 7},85 ${incomerX + 7},85`, fill: '#0f172a' }));
      svg.appendChild(el('circle', { cx: incomerX, cy: 75, r: 12, fill: '#ffffff', stroke: '#0f172a', 'stroke-width': '1.5' }));
      svg.appendChild(el('line', { x1: incomerX, y1: 100, x2: incomerX, y2: 340, stroke: '#0f172a', 'stroke-width': '2' }));

      // Số 1 nguồn vào
      const num1 = document.createElement('div');
      num1.className = 'absolute font-bold text-slate-900 text-center';
      num1.style.left = `${incomerX - 10 + 24}px`;
      num1.style.top = `${75 - 9 + 24}px`;
      num1.style.width = '20px';
      num1.style.fontSize = '12px';
      num1.textContent = '1';
      htmlLabels.appendChild(num1);

      // Ký hiệu át tổng
      svg.appendChild(el('rect', { x: incomerX - 10, y: 220, width: 20, height: 26, fill: '#ffffff', stroke: '#0f172a', 'stroke-width': '1.5' }));
      svg.appendChild(el('line', { x1: incomerX - 6, y1: 240, x2: incomerX + 6, y2: 226, stroke: '#0f172a', 'stroke-width': '1.8' }));

      // Text át tổng
      const mcbLabel = document.createElement('div');
      mcbLabel.className = 'absolute font-bold text-slate-900 text-xs';
      mcbLabel.style.left = `${incomerX + 18 + 24}px`;
      mcbLabel.style.top = `${226 + 24}px`;
      mcbLabel.textContent = mainBreaker;
      htmlLabels.appendChild(mcbLabel);

      // Cáp nguồn tổng
      const cableLabel = document.createElement('div');
      cableLabel.className = 'absolute text-xs text-slate-700 font-medium';
      cableLabel.style.left = `${incomerX + 30 + 24}px`;
      cableLabel.style.top = `${120 + 24}px`;
      cableLabel.textContent = mainCable;
      htmlLabels.appendChild(cableLabel);
      svg.appendChild(el('polyline', { points: `${incomerX + 5},135 ${incomerX + 25},130 ${incomerX + 260},130`, fill: 'none', stroke: '#64748b', 'stroke-width': '1' }));

      // Thanh cái Busbar
      const busbarY = 340;
      const busbarStartX = leftMargin;
      const busbarEndX = leftMargin + (branches.length - 1) * branchWidth;
      svg.appendChild(el('line', { x1: busbarStartX - 20, y1: busbarY, x2: busbarEndX + 20, y2: busbarY, stroke: '#0f172a', 'stroke-width': '3.5' }));

      // Các nhánh phụ tải
      branches.forEach((b, idx) => {
        const x = leftMargin + idx * branchWidth;

        // Điểm nối busbar
        svg.appendChild(el('circle', { cx: x, cy: busbarY, r: 3.5, fill: '#0f172a' }));
        svg.appendChild(el('line', { x1: x, y1: busbarY, x2: x, y2: 450, stroke: '#0f172a', 'stroke-width': '1.5' }));

        // Ký hiệu át nhánh
        svg.appendChild(el('rect', { x: x - 8, y: 365, width: 16, height: 22, fill: '#ffffff', stroke: '#0f172a', 'stroke-width': '1.2' }));
        svg.appendChild(el('line', { x1: x - 5, y1: 382, x2: x + 5, y2: 370, stroke: '#0f172a', 'stroke-width': '1.5' }));

        // Tên loại át
        const brkLabel = document.createElement('div');
        brkLabel.className = 'absolute text-[9px] text-slate-700 font-semibold';
        brkLabel.style.left = `${x + 10 + 24}px`;
        brkLabel.style.top = `${370 + 24}px`;
        brkLabel.textContent = b.breaker.split(' ')[0] || 'MCB';
        htmlLabels.appendChild(brkLabel);

        // Hộp tải chữ nhật
        const loadBoxW = 34;
        const loadBoxH = 155;
        const loadBoxY = 450;
        svg.appendChild(el('rect', { x: x - (loadBoxW / 2), y: loadBoxY, width: loadBoxW, height: loadBoxH, fill: '#f8fafc', stroke: '#0f172a', 'stroke-width': '1.5' }));

        // CHỮ DỌC GIAN HÀNG NẰM CHUẨN GỌN TRONG Ô
        const loadText = document.createElement('div');
        loadText.className = 'vertical-text absolute font-bold text-slate-900 tracking-wide text-center flex items-center justify-center';
        loadText.style.left = `${x - (loadBoxW / 2) + 24}px`;
        loadText.style.top = `${loadBoxY + 24}px`;
        loadText.style.width = `${loadBoxW}px`;
        loadText.style.height = `${loadBoxH}px`;
        loadText.style.fontSize = '10px';
        loadText.textContent = `${b.name} - ${b.power}`;
        htmlLabels.appendChild(loadText);
      });

      // Khung tên tiêu chuẩn
      const titleW = 280;
      const titleH = 45;
      const titleX = totalWidth - 12 - titleW;
      const titleY = totalHeight - 12 - titleH;
      svg.appendChild(el('rect', { x: titleX, y: titleY, width: titleW, height: titleH, fill: '#ffffff', stroke: '#0f172a', 'stroke-width': '1.2' }));
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'absolute font-bold text-slate-900 text-sm flex items-center';
      titleDiv.style.left = `${titleX + 16 + 24}px`;
      titleDiv.style.top = `${titleY + 12 + 24}px`;
      titleDiv.textContent = 'SƠ ĐỒ NGUYÊN LÝ CẤP ĐIỆN';
      htmlLabels.appendChild(titleDiv);
    }

    // ==========================================
    // XUẤT PDF SẮC NÉT KHÔNG LỖI FONT BẰNG CANVAS
    // ==========================================
    document.getElementById('btn-export-pdf').addEventListener('click', async () => {
      const element = document.getElementById('print-area');
      const btn = document.getElementById('btn-export-pdf');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Đang tạo PDF...';
      btn.disabled = true;

      try {
        // Chụp toàn bộ khung bản vẽ với scale 2x siêu nét
        const canvas = await html2canvas(element, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false
        });

        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        
        // Khổ A3 ngang
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'px',
          format: [canvas.width, canvas.height]
        });

        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('So-Do-Nguyen-Ly-Cap-Dien.pdf');
      } catch (err) {
        console.error(err);
        alert('Lỗi tạo PDF: ' + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    // ==========================================
    // XUẤT FILE AUTOCAD (.DXF)
    // ==========================================
    document.getElementById('btn-export-dxf').addEventListener('click', () => {
      const panelName = document.getElementById('panel-name').value;
      const mainBreaker = document.getElementById('main-breaker').value;
      const mainCable = document.getElementById('main-cable').value;

      const d = new Drawing();
      d.setUnits('Millimeters');

      const bWidth = 80;
      const startX = 100;
      const busY = 100;

      const endX = startX + (branches.length - 1) * bWidth;
      d.drawLine(startX - 20, busY, endX + 20, busY);

      const midX = (startX + endX) / 2;
      d.drawLine(midX, busY, midX, busY + 120);
      d.drawText(midX + 5, busY + 80, 5, 0, mainBreaker);
      d.drawText(midX + 5, busY + 110, 5, 0, mainCable);

      d.drawLine(startX - 40, busY - 30, endX + 40, busY - 30);
      d.drawLine(endX + 40, busY - 30, endX + 40, busY + 130);
      d.drawLine(endX + 40, busY + 130, startX - 40, busY + 130);
      d.drawLine(startX - 40, busY + 130, startX - 40, busY - 30);
      d.drawText(startX - 30, busY + 115, 6, 0, panelName);

      branches.forEach((b, i) => {
        const x = startX + i * bWidth;
        d.drawLine(x, busY, x, busY - 60);

        d.drawLine(x - 15, busY - 60, x + 15, busY - 60);
        d.drawLine(x + 15, busY - 60, x + 15, busY - 160);
        d.drawLine(x + 15, busY - 160, x - 15, busY - 160);
        d.drawLine(x - 15, busY - 160, x - 15, busY - 60);

        d.drawText(x - 2, busY - 150, 4, 90, `${b.name} - ${b.power}`);
        d.drawText(x + 5, busY - 30, 3.5, 0, b.breaker);
      });

      const dxfContent = d.toDxfString();
      const blob = new Blob(["\uFEFF" + dxfContent], { type: 'application/dxf;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'So-Do-Nguyen-Ly-Cap-Dien.dxf';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btn-render').addEventListener('click', drawSchematic);

    renderBranchInputs();
    drawSchematic();
  </script>
</body>
</html>
